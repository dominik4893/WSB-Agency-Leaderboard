<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSB Leaderboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f; --card:#14141d; --card2:#1a1a25; --hover:#20202d;
    --line:#262637; --text:#f2f3f8; --dim:#8a8ba1; --faint:#585a70;
    --pp:#8b5cf6; --pp2:#a78bfa; --ppglow:rgba(139,92,246,.28);
    --gold:#f5c451; --silver:#c3c9d6; --bronze:#d38a4e; --green:#34d399; --red:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
       font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
  svg{display:block}

  header{padding:44px 0 6px}
  h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
  .subtitle{color:var(--dim);font-size:15px;margin-top:6px}

  .tabs{display:flex;gap:8px;margin:24px 0 4px;flex-wrap:wrap}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--dim);
       padding:9px 18px;border-radius:11px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--text);border-color:#34344c}
  .tab.on{background:var(--pp);border-color:var(--pp);color:#fff;font-weight:600;box-shadow:0 8px 22px var(--ppglow)}

  .tagline{text-align:right;font-style:italic;font-size:19px;font-weight:500;color:#e7e8f0;opacity:.85;margin:16px 4px}

  /* podium — centered, stacked */
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
  .pcard{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:28px 20px;
    display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
  .pcard .av{width:78px;height:78px;border-radius:50%;background:#22222f;border:2px solid var(--line);
    display:grid;place-items:center;color:var(--faint);margin-bottom:18px;margin-top:4px}
  .pcard .av svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .pcard .nm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .pcard .amt{font-size:30px;font-weight:700;margin-top:14px;letter-spacing:-.5px}
  .pcard .metric{color:var(--faint);font-size:13px;margin-top:6px}
  .pcard.first{border-color:var(--pp);box-shadow:0 0 0 1px var(--pp),0 20px 55px var(--ppglow)}
  .pcard.first .av{border-color:var(--gold);color:var(--gold)}
  .pcard.second .av{border-color:var(--silver);color:var(--silver)}
  .pcard.third .av{border-color:var(--bronze);color:var(--bronze)}
  .pcard .glow{position:absolute;inset:0;background:radial-gradient(320px 130px at 50% -18%,var(--ppglow),transparent 70%);pointer-events:none}
  .youtag{font-size:10px;background:var(--pp);color:#fff;border-radius:6px;padding:2px 8px;font-weight:600;letter-spacing:.4px}

  /* full rankings */
  .rk-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;margin:8px 2px 15px}
  .rk-title svg{width:19px;height:19px;fill:none;stroke:var(--green);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 18px;transition:.15s}
  .row:hover{background:var(--hover)}
  .row.you{background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(139,92,246,.04));border-color:var(--pp)}
  .rnum{width:30px;height:30px;border-radius:9px;background:#22222f;display:grid;place-items:center;
    font-weight:600;font-size:13.5px;color:var(--dim)}
  .row.r1 .rnum{background:var(--gold);color:#231a00}
  .row.r2 .rnum{background:var(--silver);color:#1a1c26}
  .row.r3 .rnum{background:var(--bronze);color:#241300}
  .who{display:flex;align-items:center;gap:13px;min-width:0}
  .who .av{width:40px;height:40px;border-radius:50%;background:#22222f;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--faint);flex:none}
  .who .av svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9}
  .who .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .who .metric{color:var(--faint);font-size:12.5px;margin-top:1px}
  .amount{font-weight:700;font-size:16px}
  .trend svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--faint)}

  footer{color:var(--faint);font-size:12.5px;text-align:center;padding:34px 0 44px}

  /* ---- responsive ---- */
  @media(max-width:1000px){
    .podium{grid-template-columns:1fr 1fr}
    .podium .pcard.third{grid-column:1 / -1}
  }
  @media(max-width:720px){
    header{padding:30px 0 4px}
    h1{font-size:26px}
    .subtitle{font-size:14px}
    .tagline{text-align:left;font-size:16px;margin:14px 2px}
    .podium{grid-template-columns:1fr;gap:12px}
    .podium .pcard.third{grid-column:auto}
    .pcard{padding:22px 16px}
    .pcard .av{width:70px;height:70px}
    .pcard .amt{font-size:26px}
    .tabs{gap:6px}
    .tab{padding:8px 14px;font-size:13px}
    .row{padding:12px 14px;gap:12px;grid-template-columns:34px 1fr auto}
    .who .av{width:34px;height:34px}
    .who .n{font-size:14px}
    .amount{font-size:15px}
  }
  @media(max-width:420px){
    h1{font-size:23px}
    .tab{padding:7px 11px;font-size:12.5px}
    .pcard .amt{font-size:24px}
    .amount{font-size:14px}
    .rnum{width:26px;height:26px;font-size:12px}
  }
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>Leaderboard</h1>
    <div class="subtitle">Top performing members ranked by earnings.</div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab on" data-p="today">Today</div>
    <div class="tab" data-p="week">This Week</div>
    <div class="tab" data-p="month">This Month</div>
    <div class="tab" data-p="lifetime">Lifetime</div>
  </div>

  <div class="tagline" id="tagline">the day isn't over yet.</div>
  <div class="podium" id="podium"></div>

  <div class="rk-title" id="rkTitle"></div>
  <div class="rows" id="rows"></div>

  <footer>WSB Agency · updated live · demo data</footer>
</div>

<script>
// ---- inline SVG icons (clean, no emojis) ----
const IC = {
  crown: "<svg viewBox='0 0 24 24'><path d='M2 6l4.5 4L12 3l5.5 7L22 6l-1.8 12H3.8L2 6z'/><path d='M4 21h16'/></svg>",
  medal: "<svg viewBox='0 0 24 24'><circle cx='12' cy='9' r='6'/><path d='M8.5 14.5 7 22l5-3 5 3-1.5-7.5'/></svg>",
  user:  "<svg viewBox='0 0 24 24'><circle cx='12' cy='8' r='4'/><path d='M5 21v-1a7 7 0 0 1 14 0v1'/></svg>",
  trophy:"<svg viewBox='0 0 24 24'><path d='M7 4h10v5a5 5 0 0 1-10 0V4z'/><path d='M7 5H4.5a2.5 2.5 0 0 0 0 5H7'/><path d='M17 5h2.5a2.5 2.5 0 0 1 0 5H17'/><path d='M9 15v3M15 15v3M8 21h8'/></svg>",
  up:    "<svg viewBox='0 0 24 24'><path d='M4 17 10.5 10.5 14 14 20 8'/><path d='M15 8h5v5'/></svg>",
  down:  "<svg viewBox='0 0 24 24'><path d='M4 8 10.5 14.5 14 11 20 17'/><path d='M15 17h5v-5'/></svg>",
  flat:  "<svg viewBox='0 0 24 24'><path d='M5 12h14'/></svg>",
};

// ---- sample data (later: fetch('/.netlify/functions/leaderboard?period='+p)) ----
const YOU = "Dominik";
const M = (n,a,s)=>({name:n,amount:a,metric:s});   // metric = secondary count
const DATA = {
  today: [M("Cassie",6436,3),M("Lvictor Taylor",4764,3),M("Alexander Estrine",3980,5),
    M("Dominik",3120,3),M("Austin Charboneau",2540,3),M("Luís Leon",1780,1),
    M("Sofia",1240,2),M("Rebecca",980,1),M("Sandra",760,1),M("Lara",540,1)],
  week: [M("Cassie",21840,14),M("Ella",19420,12),M("Lily",17650,11),
    M("Dominik",14980,9),M("Sandra",9870,6),M("Alexander Estrine",8320,7),
    M("Sofia",6410,5),M("Rebecca",4980,3),M("Austin Charboneau",4120,3),M("Lara",2890,2)],
  month: [M("Cassie",71245,52),M("Lily",63188,44),M("Ella",58555,39),
    M("Dominik",42340,29),M("Sandra",23029,17),M("Alexander Estrine",19880,15),
    M("Sofia",14920,11),M("Rebecca",9952,7),M("Austin Charboneau",8620,6),M("Lara",5083,4)],
  lifetime: [M("Lily",312540,214),M("Cassie",298760,201),M("Ella",276410,188),
    M("Sandra",198320,142),M("Dominik",164980,121),M("Alexander Estrine",132110,98),
    M("Rebecca",98760,71),M("Sofia",84200,63),M("Austin Charboneau",61540,44),M("Aria",52310,38)],
};
const TAGLINE={today:"the day isn't over yet.",week:"the week isn't over yet.",
  month:"the month isn't over yet.",lifetime:"legends of all time."};
const METRIC_LABEL = "sales";   // <-- change this word to whatever the count means

const $=s=>document.querySelector(s);
const money=n=>"$"+Number(n).toLocaleString("en-US");
let currentPeriod="today";

async function loadData(period){
  try{
    const res=await fetch("/api/leaderboard?period="+period,{cache:"no-store"});
    if(res.ok){const d=await res.json(); if(Array.isArray(d)&&d.length) return d;}
  }catch(e){}
  return [...DATA[period]];   // fallback to demo data until submissions exist
}

async function render(period){
  currentPeriod=period;
  $("#tagline").textContent=TAGLINE[period];
  $("#rkTitle").innerHTML=`${IC.up}<span>Full Rankings</span>`;
  const list=(await loadData(period)).sort((a,b)=>b.amount-a.amount);

  const cls=["first","second","third"], rankIcon=[IC.crown,IC.medal,IC.medal];
  $("#podium").innerHTML=list.slice(0,3).map((p,i)=>`
    <div class="pcard ${cls[i]}">
      ${i===0?'<div class="glow"></div>':''}
      <div class="av">${rankIcon[i]}</div>
      <div class="nm">${p.name}</div>
      <div class="amt">${money(p.amount)}</div>
    </div>`).join("");

  $("#rows").innerHTML=list.slice(0,10).map((p,i)=>{
    return `<div class="row ${i<3?'r'+(i+1):''}">
      <div class="rnum">${i+1}</div>
      <div class="who"><div class="av">${IC.user}</div>
        <div class="n">${p.name}</div></div>
      <div class="amount">${money(p.amount)}</div>
    </div>`;
  }).join("");
}
$("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));render(t.dataset.p);});
render("today");
setInterval(()=>render(currentPeriod), 30000);   // auto-refresh every 30s
</script>
</body></html>
